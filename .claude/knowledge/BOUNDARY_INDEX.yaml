schema_version: 1
purpose: >-
  Canonical lookup: module → its ownership footprint (owned state domains, owned
  contracts, owned API mounts, accountable owner) for the Boundary Collision gate
  (G1.5, framework 1.2.0). This is the consolidated per-module view that
  boundary-collision reads to detect ownership collisions in one lookup instead of
  cross-referencing OWNERSHIP/STATE_OWNERSHIP/CONTRACT/API indexes separately.
  Derived from MODULE_REGISTRY.yaml + DEPENDENCY_GRAPH.yaml; summarizes them and
  never outranks them (knowledge/README.md Rule 3).
scope: project-runtime
derived_from: [.claude/knowledge/MODULE_REGISTRY.yaml, .claude/knowledge/DEPENDENCY_GRAPH.yaml]
version_source: .claude/VERSION.yaml
observed_revision: 1aa5f88bce9ef27c9b0563363ebaa211d8aca240  # rebound to HEAD 1aa5f88bce9ef27c9b0563363ebaa211d8aca240 by SYNC-055 (post-PR#243/#244/#245 repository-synchronization pass, 2026-07-28); content verified coherent 3254c83..1aa5f88 -- GD-18 calendar-absence narrow slice (PR #243), GD-16 decision + SPEC-DOCUMENTS-001 freeze (PR #244), backend-documents module implementation (PR #245) now reflected in-content (state-calendar-absence and state-worker-document nodes added, backend-documents module node added, stale backend-calendar orphan/stub notes corrected). Prior: rebound to HEAD 3254c83754f3660dee968c5138a32b6bc54d5578 by SYNC-054 (post-ADR-030 PR-1..PR-8 repository-synchronization pass, 2026-07-26); content verified coherent 9ca0eed..3254c83 -- ADR-030 capability-model rollout (REGIONAL_MANAGER role, capability-named gates replacing ManagerAdminGate, resolveHotelAccess/analytics regional_manager fixes) now reflected in permissions-middleware notes. Prior: rebound to HEAD 9ca0eed by SYNC-053 (post-#194 repository-synchronization + planning pass, 2026-07-23); content verified coherent 09e0b16..9ca0eed -- Epic 5/6/7/8 already reflected in-content, 367/367 backend tests green, tsc clean, repository-integrity-check.js exit 0. Prior: rebound by Repository Synchronization Workflow (Revision Rebind mode, SYNC-037) -- stamp-only, no content change; prior stamp 39fc1f5 (Package A, AUDIT-REPO-2026-07-14: ADR-016 propagated, backend-auth owned_state gains state-audit-log, stale state-audit-log unregistered_or_shared/collision row removed; edge-analytics-reads-hotel-worker applied, analytics boundary note updated) was two merges behind HEAD; content verified unchanged 39fc1f5..09e0b16

# A module "owns" a state domain when it is that domain's authoritative_writer, a
# contract when it is the contract's owner_module, and an API when it is the mount's
# module. A collision at G1.5 is any scoped change that would give a second owner to
# an already-owned item, write a domain whose authoritative_writer is another module
# or UNKNOWN, or contradict a business-rule authority.

modules:
  - module: backend-auth
    owner: unassigned
    owned_state: [state-session, state-audit-log]   # state-audit-log authoritative writer resolved by ADR-016 (Accepted, 2026-07-14); physical writes remain shared via BaseService.logAudit across all modules (unchanged by this record) -- backend-auth is the accountable/governance owner, not the sole physical writer
    shared_write_state: [state-user]   # backend-auth authoritative writer per ADR-017 (Accepted, 2026-07-15); backend-users bounded profile writer/reader
    owned_contracts: [auth-middleware]
    owned_apis: [/api/v1/auth]
    boundary: Authentication, session issuance, authorization middleware. Accountable owner of state-audit-log (ADR-016); backend-compliance is a read-only consumer, never a writer.
  - module: backend-users
    owner: unassigned
    owned_state: []
    shared_write_state: [state-user]
    owned_contracts: []
    owned_apis: [/api/v1/users]
    boundary: User CRUD; shares User writes with backend-auth.
  - module: backend-crm
    owner: unassigned
    owned_state: [state-hotel]
    owned_contracts: []
    owned_apis: [/api/v1/crm]
    boundary: Hotel/CRM records. Canonical home of the Hotels capability (SPEC-CRM-001); "Hotels module" is an alias for this module, not a standalone boundary -- no SPEC-HOTELS-001/backend-hotels exists (ADR-011, SIR-GLOB-013).
  - module: backend-hotel-workers
    owner: unassigned
    lifecycle: removed  # Epic 5 PR 5.8 (ADR-022 roadmap step 6, ADR-024 D5): module (routes/controller/service/types) and route mount physically deleted; see MODULE_REGISTRY.yaml
    owned_state: []  # state-hotel-worker is now DORMANT (authoritative_writer: none), not owned by any module; see STATE_OWNERSHIP_INDEX.yaml
    owned_contracts: []
    owned_apis: []  # /api/v1/crm/hotels/:hotel_id/workers mount removed with the module
    boundary: "HISTORICAL: formerly the hotel-worker roster (reads state-hotel, state-user). Physically retired by Epic 5 PR 5.8 -- NOT part of the target architecture (ADR-022). The HotelWorker table/model itself remains untouched in schema.prisma (no DROP TABLE, no data loss); Employee Management (backend-hr/SPEC-EMP-001) is the long-term owner of the employment-record capability via a separate build, not an in-place repurposing of this module."
  - module: backend-job-requests  # renamed from backend-work-requests by Epic 9 PR 9.4 (commits a69c8fd, merged b0904ba; TREQ-013/MIG-GAP-12), same live module. See SYNC-061, SYNC-062.
    owner: unassigned
    owned_state: [state-job-request]  # renamed from state-work-request by Epic 9 PR 9.4. See SYNC-061.
    owned_contracts: []
    owned_apis: [/api/v1/work-requests]  # URL mount path retained unchanged by Epic 9 PR 9.4 (module/model rename only, public API contract not renamed)
    boundary: Job-request lifecycle (renamed from "work-request" by Epic 9 PR 9.4); the former cross-module write coupling from work-applications' accept transaction no longer applies -- backend-work-applications was physically deleted by Epic 9 PR 9.2 (TREQ-011/ADR-058). See SYNC-059, SYNC-061.
  - module: backend-work-applications  # RETIRED by Epic 9 PR 9.2 (commits 12b1c31/2e89c4f, merged b035700; TREQ-011/ADR-058)
    lifecycle: removed  # module (routes/controller/service/types) and route mount, plus the WorkApplication model + ApplicationStatus enum + WorkerAssignment.application_id FK, physically deleted; see MODULE_REGISTRY.yaml. See SYNC-059, SYNC-062.
    owned_state: []  # state-work-application entry REMOVED; no row remains, see git history for the historical record
    owned_contracts: []
    owned_apis: []  # /api/v1/work-requests/:id/applications mount removed with the module
    boundary: "HISTORICAL: formerly the marketplace apply/accept flow (worker applies, manager approves), owning state-work-application and cross-module-writing state-work-request/state-worker-assignment/state-attendance via the accept-application transaction. Physically retired by Epic 9 PR 9.2 -- the confirmed marketplace-to-broadcast pivot (TREQ-011) required removing worker-initiated applications entirely. The cross-module write coupling this entry's own note previously flagged as 'approved-coupling decision pending' was classified SUPERSEDED-BY-PIVOT by ADR-018 (Accepted, 2026-07-15), not adopted as a permanent pattern -- consistent with this retirement."
  - module: backend-assignments
    owner: unassigned
    owned_state: [state-worker-assignment]   # record created by work-applications, owned/updated here
    owned_contracts: []
    owned_apis: [/api/v1/assignments]
    boundary: Worker assignment lifecycle.
  - module: backend-attendance
    owner: unassigned
    owned_state: [state-attendance]
    owned_contracts: []
    owned_apis: [/api/v1/attendance]
    boundary: Attendance records; seeded by work-applications accept tx.
  - module: backend-quality
    owner: unassigned
    owned_state: [state-quality-verification, state-rating, state-worker-overall-rating]
    owned_contracts: []
    owned_apis: [/api/v1/quality]
    boundary: Quality verification + ratings aggregation.
  - module: backend-notifications
    owner: unassigned
    owned_state: [state-notification]
    owned_contracts: [notification-service]
    owned_apis: [/api/v1/notifications]
    boundary: Notification persistence + fan-out contract consumed by four modules.
  - module: backend-analytics
    owner: unassigned
    owned_state: []   # pure read-only aggregator, no owned state
    owned_contracts: []
    owned_apis: [/api/v1/analytics]
    boundary: Read-only cross-module aggregation (leaderboard/stats/hotel-summary). Reads 7 graphed domains owned by others, including state-hotel-worker via edge-analytics-reads-hotel-worker (applied by repository-synchronization Package A step 5, AUDIT-M3; formerly a known-missing edge, SYNC-010/FIND-DEP-001); leaderboard route missing authorization (Critical, SYNC-010).
  - module: backend-hr
    owner: unassigned
    owned_state: []
    owned_apis: [/api/v1/hr]
    boundary: Active (HR implementation PR 1-5, 2026-07-30, following the backend-hr/SPEC-EMP-001 boundary review; CORRECTED 2026-07-30, HR epic post-closeout synchronization pass -- this row previously stopped at PR 1/2, three PRs stale): Contract/PayslipRequest schema landed; createContract/listContracts/getContractStatus/uploadSignedContract/confirmContractSigned/extendContract/manualLapseContract/requestPayslip/createPayroll/listPayroll/fulfilPayslipRequest/sendExpiryReminders all real -- see MODULE_REGISTRY.yaml's backend-hr entry for the full PR-by-PR evidence trail. Mounted + consumed by mobile-worker. Canonical home of the Contracts capability (SPEC-HR-001) -- contract lifecycle, templates, generation, metadata, versions, amendments, signatures, manager confirmation, acceptance workflow, renewals, expiry, and archival state; "Contracts module"/"Contracts/HR module"/"Contract Management module" is an alias for this module, not a standalone boundary -- no SPEC-CONTRACTS-001/backend-contracts exists (ADR-012, SIR-GLOB-014). Onboarding, employee-management, Documents, Payslips, and Compliance consume this capability; they do not own it. Also canonical home of the payslip-request-to-manager-fulfilment capability (RULE-HR-09/RULE-HR-12, IF-HR-RequestPayslip, IF-HR-FulfilPayslipRequest, EVT-HR-PayslipRequested/EVT-HR-PayslipFulfilled, Requested->Fulfilled state machine) -- RESOLVED by ADR-014 (Accepted, 2026-07-13): backend-hr/SPEC-HR-001 is the exclusive owner; no SPEC-PAYSLIPS-001/backend-payslips module is created (closes SIR-GLOB-017, SIR-HR-020, SYNC-031). A chatbot or other consumer may initiate the payslip workflow only through IF-HR-RequestPayslip/IF-HR-FulfilPayslipRequest, never owning payslip business logic or state. docs/03-modules/payslips/ remains a non-owning placeholder, retaining only .gitkeep. CORRECTED by the backend-hr/SPEC-EMP-001 boundary review (2026-07-30): MODULE_REGISTRY.yaml's `specification` field for this module previously cited SPEC-EMP-001 (a leftover artifact from before employee-management was split into its own dedicated module, 2026-07-22) and now correctly cites SPEC-HR-001, this module's own spec; SPECIFICATION_INDEX.yaml gained a separate employee-management row for SPEC-EMP-001. OD-HR-01a/OD-HR-01b (the HR-vs-Onboarding module-boundary dispute) are RESOLVED (ADR-012); OD-HR-02b (Personalfragebogen data-source ambiguity) is RESOLVED (boundary review: persisted employee-management record, not a transient Onboarding source). OD-EMP-10 (employee-management's own docs<->code mapping) is likewise resolved in practice by the 2026-07-22 build decision, though SPEC-EMP-001's own text has not yet been updated to close that row.
  - module: backend-calendar
    owner: unassigned
    owned_state: [state-calendar-absence]   # LANDED 2026-07-27 (narrow GD-18 slice): CalendarAbsence Prisma model, migration 20260727040000_add_calendar_absence. authoritative_writer backend-calendar per ADR-021; kind in {sick, vacation}
    target_owned_state: []   # the today-only availability read-model (REQ-CAL-T06) remains target-only, unbuilt by this slice
    owned_apis: [/api/v1/calendar, /api/v1/calendar/my-absences]
    boundary: Narrow slice landed 2026-07-27 (GD-18, human-directed scope): worker self-marks sick/vacation via GET/POST /calendar/my-absences (self-scoped, any authenticated role); the manager weekly-plan placement view and the today-only availability read-model remain unbuilt. Canonical home of the Calendar capability (SPEC-CALENDAR-001) and, by extension, Scheduling -- Scheduling is not a standalone boundary; no SPEC-SCHEDULING-001/backend-scheduling exists and future scheduling functionality evolves SPEC-CALENDAR-001 (ADR-011, SIR-GLOB-013). Scheduling-ownership boundary settled by ADR-021 (Accepted 2026-07-19): Job Dispatch (FROZEN SPEC-JOB-DISPATCH-001@0.3.1, amended 2026-07-19 per ADR-021) is sole owner of WorkerAssignment, CalendarEntry, assignment creation, and daily-exclusivity enforcement; backend-calendar performs NO cross-boundary write to that state -- the same-day auto-cancel is implemented as a direct in-process call to AssignmentService.update() (not the target EVT-CAL-SickVacationMarked event, since no event bus exists yet, GD-12 undecided; a human-approved narrower mechanism, verified by independent architecture review to still respect the ownership boundary). Resolves OD-CAL-01/02/03 and SPEC-EMP-001 OD-EMP-07.
  - module: backend-documents
    owner: unassigned
    owned_state: [state-worker-document]   # LANDED 2026-07-27 (PR #245, GD-16): WorkerDocument Prisma model, migration 20260727060000_add_worker_document. authoritative_writer backend-documents.
    owned_contracts: []
    owned_apis: [/api/v1/documents]
    boundary: LANDED 2026-07-27 (PR #245, per GD-16 self-upload+manager-upload/hotel-scoped-read model). Canonical home of the Documents capability (SPEC-DOCUMENTS-001@0.1.4, FROZEN) -- document lifecycle, metadata, uploads, storage abstraction, categories (GENERAL/WORK_PERMIT), completeness, retrieval, export. All five IF-DOC-* interfaces built. CORRECTED (2026-07-30, HR epic post-closeout synchronization pass): MIG-GAP-DOC-001 is now RESOLVED -- HR implementation PR 3 (2026-07-30) wired backend-hr's uploadDocument() (backend/src/modules/hr/service.ts:802-820) to delegate directly to this module's documentService.uploadDocument() (in-process call, RULE-DOC-04); the two upload paths are no longer physically distinct for that route. This is a resolved consumer edge from backend-hr; see DEPENDENCY_GRAPH.yaml's edge-hr-uploads-via-documents.
  - module: frontend-web
    owner: unassigned
    boundary: Next.js web client; consumes-api only, owns no backend state/contract.
  - module: mobile-worker
    owner: unassigned
    boundary: Expo worker client; consumes-api only.
  - module: mobile-checker
    owner: unassigned
    boundary: Expo checker client; consumes-api only.
  - module: operations
    owner: unassigned
    boundary: Infrastructure/deploy surface; deploys-to backend + frontend.

