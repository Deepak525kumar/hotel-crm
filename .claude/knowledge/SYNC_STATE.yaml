      additive, backward-compatible extension: a deterministic, dependency-free
      checker (`.claude/tooling/repository-integrity-check.js`) added as a
      mandatory sub-check owned by the existing Consistency Reviewer wherever
      consistency review applies (G4), reused unchanged at G6 (Documentation
      Validator) and G9 (Post-flight) rather than re-derived per gate. The
      identical script is independently enforced by a new CI job
      (`.github/workflows/ci.yml`, job `repository-integrity`) on every pull
      request, giving human- and AI-authored changes symmetric enforcement. No
      new workflow or gate: `constitution/REVIEW_GATES.md` gains one
      Applicability Rules entry; `knowledge/LOOP_REGISTRY.yaml` gains one
      `produced_artifacts` item each on `consistency-review`/`validation`/
      `postflight`; `workflows/README.md` registers the new `ART-INTEGRITY`
      artifact-id prefix; `templates/REPOSITORY_INTEGRITY_VALIDATION_TEMPLATE.md`
      and `checklists/consistency.md` `CS-11` added. A checked-in baseline
      (`.claude/tooling/repository-integrity-baseline.json`) fingerprints
      pre-existing findings so only new regressions block CI; every baselined
      finding is tracked to a `SIR-*` row (governance register). VERSION.yaml
      bumped 1.3.0 -> 1.4.0; ADR-019 authored (Proposed, pending ratification,
