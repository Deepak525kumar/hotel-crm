      artifact-id prefix; `templates/REPOSITORY_INTEGRITY_VALIDATION_TEMPLATE.md`
      and `checklists/consistency.md` `CS-11` added. A checked-in baseline
      (`.claude/tooling/repository-integrity-baseline.json`) fingerprints
      pre-existing findings so only new regressions block CI; every baselined
      finding is tracked to a `SIR-*` row (governance register). VERSION.yaml
