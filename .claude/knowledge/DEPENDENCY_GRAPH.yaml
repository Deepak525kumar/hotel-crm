    source: backend/src/middleware/auth.ts
    note: "authMiddleware / optionalAuthMiddleware. Applied globally to v1 router and per-module in routes.ts. backend-work-applications removed from consumers by Epic 9 PR 9.2 (commits 12b1c31/2e89c4f, merged b035700; TREQ-011/ADR-058) -- the module was physically deleted. See SYNC-059."
