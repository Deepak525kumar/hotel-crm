  # Infrastructure
  - { id: operations, kind: infrastructure, owner: unassigned, source: "." }
  # worker: canonically named "Platform Worker" by ADR-029 (GD-01, 2026-07-23) -- not just
  # "a worker process", since it drains state-outbox for notification delivery and
  # scheduled jobs, and is the durable-delivery half of ADR-032 (GD-12, 2026-07-28):
  # direct in-process calls are the platform standard for synchronous cross-module
  # effects; this Outbox is the sole approved mechanism for asynchronous/durable work;
  # no generic event bus exists or is introduced -- "domain-event publishing" here means
  # Outbox-shaped events (see state-outbox's own note on payload_version), not a
  # separate pub/sub transport. A second Node entrypoint
  # (backend/src/worker.ts -> dist/worker.js) over the SAME modular-monolith codebase +
  # Prisma client, deployed as a separate OS process (ecosystem.config.js app
  # `hotel-crm-worker`). Drains state-outbox (poll interval configuration-driven, initial
  # deployment default 5s), delivers via transport handlers (EMAIL: real handler as of PR 7.4
  # -- SendGrid/Resend selected by EMAIL_SERVICE via a provider-client abstraction
  # (modules/notifications/email-provider.ts), falling back to the PR-7.2 no-op/log handler
  # when unconfigured, resolveEmailTransportHandler(); PUSH: real handler as of PR 7.5 --
  # APNs (HTTP/2 + ES256 JWT) and FCM (OAuth2 RS256 JWT exchange + HTTP v1), each configured
  # independently via modules/notifications/push-provider.ts, falling back to the PR-7.2
  # no-op/log handler only when neither platform is configured, resolvePushTransportHandler();
  # WEBHOOK/SMS reserved and unregistered so their rows are never claimed -- ADR-029 §4;
  # handlers must be idempotent, event_id is the canonical provider-side idempotency key),
  # runs the OutboxStatus lifecycle (claim PENDING/FAILED via FOR UPDATE SKIP LOCKED ->
  # DELIVERED | FAILED-with-backoff | DEAD_LETTER, plus stale-PROCESSING reclaim for
  # at-least-once), and hosts scheduled jobs via lib/scheduler.ts (mechanism only, no domain job
  # registered yet).
  # PR 7.8: PUSH's single ApnsProviderClient now resolves its `apns-topic` PER DELIVERY
  # from the token's PushToken.app (WORKER/CHECKER), not from one shared bundle ID --
  # worker-app and checker-app have distinct bundle IDs and manager/admin may hold a
  # token for both, so one topic could never be correct for both apps. Config:
  # APNS_BUNDLE_ID_WORKER / APNS_BUNDLE_ID_CHECKER (replaces the former single
  # APNS_BUNDLE_ID). Still one client, one team-scoped cached JWT for both apps.
  # lifecycle: observed as of Epic 7 PR 7.8 (2026-07-24) -- runtime, claim/lifecycle, backoff,
  # dispatch interface, scheduler mechanism, both real transport handlers (EMAIL, PUSH), the
  # observability/dead-letter operator surface (PR 7.6), and multi-app APNs topic selection
  # (PR 7.8) landed in code (backend/src/worker.ts,
  # modules/notifications/outbox-{worker,repository,transport,backoff,admin-service}.ts,
  # modules/notifications/{email,push}-provider.ts, lib/scheduler.ts).
  - { id: worker, kind: infrastructure, owner: unassigned, source: backend/src/worker.ts, name: "Platform Worker", lifecycle: observed }

