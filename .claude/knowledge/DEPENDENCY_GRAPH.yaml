    model: RoomsCompletedEntry
    authoritative_writer: backend-assignments
    writers: [backend-assignments]
    readers: [backend-analytics]
    evidence: "assignments writes: backend/src/modules/assignments/service.ts (logRoomsCompleted); analytics reads: backend/src/modules/analytics/service.ts (getDashboardStats/getHotelSummary roomsCompletedEntry.aggregate)"
    note: "Added by ADR-028 (2026-07-22, OQ-ANALYTICS-03): manager-entered 'rooms completed' daily count, 1-to-1 with WorkerAssignment (the worker's full-day assignment) -- no room-level task layer, per CONFIRMED_REQUIREMENTS_REGISTER.md §33. Structurally mirrors the state-rating/state-quality-verification pattern (a 1-to-1 sibling table keyed on assignment_id, manager/checker-entered, denormalised hotel_id/worker_id); unlike those two (owned by a separate backend-quality module), this entry is owned by backend-assignments itself -- the authoritative writer of the parent state-worker-assignment domain -- since the write is a same-module extension of closing out the assignment (manager logs the count at/after completion), not a distinct verification/rating capability warranting a separate module. Deliberately not a field on ReceptionData (out of scope for that model per its own PIVOT §9.3 definition, and ReceptionData is itself unbuilt target state)."
  - id: state-notification
    model: Notification
    authoritative_writer: backend-notifications
    writers: [backend-notifications]
    readers: [backend-notifications]
    evidence: "backend/src/modules/notifications/service.ts:8,20,28,34"
    note: "Only notifications writes/reads directly; other modules produce notifications through the notification-service `calls` contract, not by touching this state. ADR-029 (GD-01, 2026-07-23) adds a transactional `enqueue` path on notification-service: a producer's transaction persists its domain change + the Notification inbox row + an OutboxEvent (state-outbox) in one commit; the in-app REST surface (GET /notifications, POST /:id/read) is unchanged."
  # state-outbox: internal delivery queue, added by ADR-029 (GD-01, 2026-07-23). Distinct
  # from state-notification (the user-facing inbox): never client-exposed. Written by the
  # request-path notification-service enqueue (in the producer's transaction); the Platform
  # Worker (status lifecycle transitions + retry bookkeeping) is PR 7.2, not yet built --
  # writers/readers below list it as the design's eventual actor, not an observed one yet.
  # lifecycle: observed as of Epic 7 PR 7.1 (2026-07-23) -- model, enums, migration, and
  # NotificationService.enqueue() landed in code (schema.prisma, notifications/service.ts).
  # No producer has been migrated to call enqueue() yet (PR 7.3); the four current
  # producers' fire-and-forget notificationService.sendNotification() calls are unchanged.
  - id: state-outbox
    model: OutboxEvent
    lifecycle: observed
    authoritative_writer: backend-notifications
    writers: [backend-notifications, worker]
    readers: [worker]
    evidence: "backend/prisma/schema.prisma (model OutboxEvent + 5 enums); backend/prisma/migrations/20260723210000_add_outbox_event/migration.sql; backend/src/modules/notifications/service.ts (enqueue/enqueueWithin); backend/src/modules/notifications/outbox.types.ts. `worker` in writers/readers is the ADR-029-designed future actor (PR 7.2, not yet built), not an observed relationship."
    note: "OutboxEvent {event_id (globally-unique, idempotency key), event_type, transport (OutboxTransport: EMAIL/PUSH/WEBHOOK/SMS), status (OutboxStatus: PENDING/PROCESSING/DELIVERED/FAILED/DEAD_LETTER), payload, payload_version (starts 1), attempts, next_attempt_at, last_error, processed_at, timestamps}. Owned exclusively by backend-notifications -- no other module writes state-outbox directly, every producer goes through notificationService.enqueue() (same single-writer discipline as state-notification, see that entry's note). backend-notifications enqueues in the producer transaction; the Worker claims rows via SELECT ... FOR UPDATE SKIP LOCKED (a PostgreSQL feature, not an external queue), transitions status, and retries with configurable exponential backoff (default 1m/5m/15m/1h). processed_at + attempts/retry-count support the minimum observability surface (queued/processing/delivered/failed/dead_letter counts, retry_count, delivery_latency = processed_at - created_at). Retention tier pending (SIR-NOTIF-002 / GD-09). Shaped (incl. payload_version) to also carry future domain events (GD-12)."
  - id: state-audit-log
    model: AuditLog
    authoritative_writer: backend-auth
    writers: [shared-via-base-service]
    readers: [backend-compliance]
    evidence: "backend/src/lib/base-service.ts:19 (logAudit -> this.prisma.auditLog.create); inherited by every service"
    note: "Written through the shared BaseService.logAudit by any module (unchanged by this record -- no refactor performed); authoritative_writer resolved backend-auth by ADR-016 (Accepted, 2026-07-14), closing SYNC-005/SIR-GLOB-006's state-audit-log half. backend-compliance is a read-only consumer, never a writer, per ADR-016 (docs/03-modules/compliance/MODULE_SPEC.md, zero code footprint, target-state read only)."
  - id: state-password-reset-token
    model: PasswordResetToken
    authoritative_writer: backend-auth
    writers: [backend-auth]
    readers: [backend-auth]
    evidence: "backend/src/modules/auth/service.ts (requestPasswordReset/confirmPasswordReset: passwordResetToken.deleteMany/create/findUnique/update); added by HOTFIX-AUTH-002 (SIR-AUTH-001)"
    note: "Single-writer, no collision. Mirrors the existing state-session pattern (FK-cascaded from User, backend-auth-only)."

analysis:
  circular_dependencies:
    code_imports: none
    note: "No backend module imports another module except the notification-service singleton (notifications imports no other module), so the static import graph is acyclic. A DATA-level bidirectional coupling exists between backend-work-requests and backend-work-applications (work-requests reads WorkApplication; work-applications reads and writes WorkRequest) via shared Prisma models, but this is not a code-import cycle."
  orphan_modules:
    - { id: backend-chatbot, reason: "placeholder-unregistered; only .placeholder file; no imports, no mount, no client." }
    - { id: backend-geo, reason: "placeholder-unregistered; only .placeholder file; no imports, no mount, no client." }
    - { id: backend-calendar, reason: "mounted at runtime (routes/v1/index.ts:34) but stub (all methods throw NotImplementedError); no discovered client consumer and no cross-module edge." }
  stub_but_registered:
    - { id: backend-hr, note: "stub service (NotImplementedError) but consumed by mobile-worker (/hr) and mounted at runtime." }
    - { id: backend-calendar, note: "stub service (NotImplementedError); mounted but no consumer discovered." }
  unknown_relationships:
    - "All module owners (node owner) and contract versions are UNKNOWN — human assignment required (per MODULE_REGISTRY.yaml)."
    - "state-user authoritative_writer RESOLVED backend-auth by ADR-017 (2026-07-15); backend-users is a bounded profile writer/reader (non-security fields only). Node-level accountable owner (SYNC-001) remains UNKNOWN."
    - "state-audit-log authoritative_writer RESOLVED backend-auth by ADR-016 (2026-07-14); shared-write via BaseService across 8+ modules continues unchanged, only the accountable/governance owner is newly designated."

remaining_human_decisions:
  - "Assign an accountable owner to every module, shared contract, and state domain (all currently UNKNOWN)."
  - "RESOLVED (ADR-017, Accepted, 2026-07-15): the authoritative writer of state-user is backend-auth; backend-users is a bounded profile writer/reader (non-security profile fields only). Closes SYNC-005/SIR-GLOB-006's state-user half. Node-level accountable-owner assignment (SYNC-001) remains OPEN under the first item above."
  - "RESOLVED (ADR-018, Accepted, 2026-07-15): the cross-module write coupling in the accept-application transaction (backend-work-applications creating/mutating WorkRequest, WorkerAssignment, and Attendance records owned by other modules, backend/src/modules/work-applications/service.ts:219-283) is classified SUPERSEDED-BY-PIVOT -- the confirmed pivot retires the marketplace apply/accept flow; it is NOT adopted as an approved permanent coupling, so no sanctioned edge is added. Live-code removal is implementation work tracked against the frozen specs."
  - "Decide retirement or activation of backend-chatbot and backend-geo (unregistered placeholders) and completion of stub modules backend-hr and backend-calendar."
  - "Assign contract versions to notification-service, prisma-schema, base-service, and the middleware contracts (all currently unversioned)."
