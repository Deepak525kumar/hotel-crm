  # EmploymentRecord to group-grain hotel eligibility, replacing the 10
  # call-site-local HotelWorker ACTIVE-membership reads, flag-gated by
  # FEATURE_ROSTER_CUTOVER (default off = unchanged HotelWorker behavior).
  - { id: scope-lib, kind: contract, owner: unassigned, source: backend/src/lib/scope.ts }
  - { id: roster-scope-lib, kind: contract, owner: unassigned, source: backend/src/lib/roster-scope.ts }

