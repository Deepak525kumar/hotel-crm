edges:
  # --- Backend cross-module service calls (notification fan-out) ---
  # Each caller imports the shared `notificationService` singleton and invokes
  # sendNotification (fire-and-forget; a delivery failure never rolls back).
  - id: edge-work-requests-notifications
    source: backend-job-requests
    target: backend-notifications
    kind: calls
    contract: notification-service
    compatibility: unknown
    status: observed
    evidence: "backend/src/modules/job-requests/service.ts:4,240-242"
    note: "Edge id kept stable (not renamed to edge-job-requests-notifications) — Epic 9 PR 9.7's own plan text notes 9.4 kept the module's outbox-facing identity stable by design; source node renamed backend-work-requests -> backend-job-requests. See SYNC-061."
  # edge-work-applications-notifications REMOVED by Epic 9 PR 9.2 (commits
  # 12b1c31/2e89c4f, merged b035700; TREQ-011/ADR-058) — backend-work-applications
  # was physically deleted; it no longer calls notification-service. See SYNC-059.
  - id: edge-attendance-notifications
    source: backend-attendance
    target: backend-notifications
    kind: calls
    contract: notification-service
    compatibility: unknown
    status: observed
    evidence: "backend/src/modules/attendance/service.ts:4,187,200"
  - id: edge-quality-notifications
    source: backend-quality
    target: backend-notifications
    kind: calls
    contract: notification-service
    compatibility: unknown
    status: observed
    evidence: "backend/src/modules/quality/service.ts:4,75,191"

  # --- Cross-module state writes (work-applications accept-application transaction) ---
  # edge-work-applications-writes-work-request, edge-work-applications-writes-worker-assignment,
  # and edge-work-applications-writes-attendance REMOVED by Epic 9 PR 9.2 (commits
  # 12b1c31/2e89c4f, merged b035700; TREQ-011/ADR-058) — the accept-application
  # transaction and the module that ran it (backend-work-applications) were physically
  # deleted; these cross-module writes no longer occur. See SYNC-059 and git history
  # for the historical relationship record.

  # --- Cross-module state reads (a module reads a state domain it does not own) ---
  # ADR-031 D-3/PR-8 (2026-07-27): backend-auth already owns state-user's writer role
  # (ADR-017); this edge records the newly-live REQUEST-PATH read auth-middleware.ts
  # added (ADR-031 D-3, unconditional as of PR-7) -- one indexed User row read on every
  # authenticated request, to resolve is_active/deleted_at/role/token_generation for
  # request-time permission derivation and token_generation revocation. Distinct from
  # (additional to) the pre-existing write-path ownership edge.
  - id: edge-auth-middleware-reads-user
    source: backend-auth
    target: state-user
    kind: reads-state
    compatibility: not-applicable
    status: observed
    evidence: "backend/src/middleware/auth.ts (resolveLiveAuth: prisma.user.findUnique, unconditional as of ADR-031 PR-7)"
  - id: edge-work-requests-reads-hotel
