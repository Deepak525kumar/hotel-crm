status: verified-edges
# Relationship discovery is complete for the observed revision: every module in
# MODULE_REGISTRY.yaml is represented and every edge is repository-backed. Owners
# remain `unassigned` (equivalent to UNKNOWN): module owners and contract versions
# require authoritative human assignment (SYNC-001, blocked; see MODULE_REGISTRY.yaml).
# Discovery is derived from repository evidence only; the MODULE_REGISTRY.yaml
# inventory is authoritative and is never rediscovered here. Note: reads-state /
# writes-state edges record observed Prisma model access; designating a single
# authoritative writer per state domain remains reserved human authority.

node_schema:
  required: [id, kind, owner, source]
  kinds: [module, client, infrastructure, contract, event, state-domain, external-service]

edge_schema:
  required: [id, source, target, kind, evidence, status]
  kinds: [calls, imports, consumes-api, publishes-event, consumes-event, reads-state, writes-state, shared-contract, deploys-to, package]
  compatibility: [compatible, conditional, breaking, unknown, not-applicable]

