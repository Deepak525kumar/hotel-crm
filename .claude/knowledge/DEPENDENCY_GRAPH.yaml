  - { id: state-worker-assignment, kind: state-domain, owner: backend-assignments, source: "backend/prisma/schema.prisma:314 (model WorkerAssignment)" }
  - { id: state-attendance, kind: state-domain, owner: backend-attendance, source: "backend/prisma/schema.prisma:359 (model Attendance)" }
