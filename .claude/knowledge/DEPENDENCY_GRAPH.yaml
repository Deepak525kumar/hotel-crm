    note: "Single-writer, no collision. Mirrors the existing state-session pattern (FK-cascaded from User, backend-auth-only)."

analysis:
  circular_dependencies:
    code_imports: none
    note: "No backend module imports another module except the notification-service singleton (notifications imports no other module), so the static import graph is acyclic. A DATA-level bidirectional coupling HAD existed between backend-work-requests and backend-work-applications (work-requests read WorkApplication; work-applications read and wrote WorkRequest) via shared Prisma models, but this was never a code-import cycle. This coupling no longer exists as of Epic 9 PR 9.2 (commits 12b1c31/2e89c4f, merged b035700; TREQ-011/ADR-058): backend-work-applications and the WorkApplication model were physically deleted, so one side of the coupling no longer exists. Corrected to historical per the commissioning human's own instruction that this note needed updating since one side no longer exists. See SYNC-059."
  orphan_modules:
