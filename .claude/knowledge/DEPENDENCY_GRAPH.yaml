    kind: reads-state
    compatibility: not-applicable
    status: observed
    evidence: "backend/src/modules/job-requests/service.ts:66 (this.prisma.hotel.findUnique)"
    note: "source renamed backend-work-requests -> backend-job-requests by Epic 9 PR 9.4. See SYNC-061."
