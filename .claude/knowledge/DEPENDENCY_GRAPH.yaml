  # state-outbox: internal delivery queue, added by ADR-029 (GD-01, 2026-07-23). Distinct
  # from state-notification (the user-facing inbox): never client-exposed. Written by the
  # request-path notification-service enqueue (in the producer's transaction) AND by the
  # Platform Worker (claim -> PROCESSING, and the DELIVERED/FAILED/DEAD_LETTER transitions);
  # read by the Platform Worker's claim. Both actors are now observed in code.
  # lifecycle: observed -- Epic 7 PR 7.1 (2026-07-23) added the model/enums/migration and the
  # enqueue() writer; Epic 7 PR 7.2 (2026-07-24) added the Platform Worker reader/transition
  # writer. No producer has been migrated to call enqueue() yet (PR 7.3); the four current
  # producers' fire-and-forget notificationService.sendNotification() calls are unchanged.
  - id: state-outbox
    model: OutboxEvent
    lifecycle: observed
    authoritative_writer: backend-notifications
    writers: [backend-notifications, worker]
    readers: [worker]
    evidence: "backend/prisma/schema.prisma (model OutboxEvent + 5 enums); backend/prisma/migrations/20260723210000_add_outbox_event/migration.sql; enqueue writer: backend/src/modules/notifications/service.ts (enqueue/enqueueWithin); worker reader/transition writer: backend/src/modules/notifications/outbox-repository.ts (claimBatch FOR UPDATE SKIP LOCKED, markDelivered, recordFailure) driven by outbox-worker.ts; operator reader/writer: backend/src/modules/notifications/outbox-admin-service.ts (getMetrics, listDeadLetters, requeue, discard) behind admin-only routes, added Epic 7 PR 7.6."
    note: "OutboxEvent {event_id (globally-unique, idempotency key), event_type, transport (OutboxTransport: EMAIL/PUSH/WEBHOOK/SMS), status (OutboxStatus: PENDING/PROCESSING/DELIVERED/FAILED/DEAD_LETTER), payload, payload_version (starts 1), attempts, next_attempt_at, last_error, processed_at, timestamps}. Owned exclusively by backend-notifications -- no other module writes state-outbox directly, every producer goes through notificationService.enqueue() (same single-writer discipline as state-notification, see that entry's note). backend-notifications enqueues in the producer transaction; the Worker claims rows via SELECT ... FOR UPDATE SKIP LOCKED (a PostgreSQL feature, not an external queue), transitions status, and retries with configurable exponential backoff (default 1m/5m/15m/1h). processed_at + attempts/retry-count support the minimum observability surface (queued/processing/delivered/failed/dead_letter counts, retry_count, delivery_latency = processed_at - created_at). Retention tier pending (SIR-NOTIF-002 / GD-09). Shaped (incl. payload_version) to also carry future domain events (GD-12). Epic 7 PR 7.6 adds the ADR-029 §9 observability surface (status counts, backlog depth + oldest-non-terminal age, average delivery latency) and a THIRD writer alongside enqueue and the worker: an admin-only operator surface (requeue DEAD_LETTER->PENDING preserving attempts/last_error; discard = delete). Both operator actions are guarded on DEAD_LETTER and are the only state-outbox writes that produce an AuditLog row (actions outbox.requeue/outbox.discard, resource_type OUTBOX_EVENT, resource_id = event_id so the trail survives a discard). A DEAD_LETTER transition itself is deliberately NOT audited -- it is operational state the row already captures (human decision, 2026-07-24). Operator runbook: docs/11-deployment/monitoring/PLATFORM_WORKER_RUNBOOK.md."
  # state-push-token: registered device push tokens, added by Epic 7 PR 7.5 (ADR-029 §4).
  # `token` (not user_id+token) carries the unique constraint -- a device token is
  # device-specific, so re-registering it under a different user reassigns ownership
  # (security-correctness: a stale token must stop delivering to a previous user the
  # moment a new one registers it). Written by notification-service.registerPushToken
  # (upsert keyed by token) and by the Platform Worker (PushTransportHandler deletes a
  # row the moment its provider confirms the token permanently invalid -- APNs
  # 410/BadDeviceToken, FCM UNREGISTERED); read by the Platform Worker's PUSH fan-out
  # (all tokens for a Notification's recipient).
  #
  # Epic 7 PR 7.8 (backend-only architecture fix, found while scoping PR 7.7):
  # PushToken gained `app` (PushApp: WORKER|CHECKER), NOT NULL, no default --
  # additive (the table carried zero rows in every environment) and no impossible
  # null state to handle. Reason: APNs requires the `apns-topic` header to equal
  # the bundle ID of the app that minted the token (com.hotelcrm.workerapp vs.
  # com.hotelcrm.checkerapp), and manager/admin may use BOTH apps, so `platform`
  # alone could not select the correct topic -- every iOS send under the old
  # single APNS_BUNDLE_ID would have been correct for at most one app. `app` is
  # deliberately the APPLICATION, not the bundle ID: bundle IDs stay deployment
  # configuration (APNS_BUNDLE_ID_WORKER / APNS_BUNDLE_ID_CHECKER), so a client
  # can never influence an APNs header, and changing a bundle ID never requires a
  # data migration. Still ONE ApnsProviderClient / one cached JWT for both apps
  # -- an APNs auth key is team-scoped, not app-scoped -- with the topic resolved
  # per delivery from PushToken.app. FCM/Android is unaffected: an FCM
  # registration token is self-identifying, so there is no equivalent header.
  #
  # Epic 7 PR 7.7: the registration endpoint gains its first real callers --
  # mobile-worker and mobile-checker each call registerForPushNotificationsAsync()
  # once per authenticated launch (see the edge-mobile-*-notifications evidence
  # above), sending their own PUSH_APP constant as `app`. Until this PR the
  # endpoint had zero client callers in the repository.
  - id: state-push-token
    model: PushToken
    lifecycle: observed
    authoritative_writer: backend-notifications
    writers: [backend-notifications, worker]
    readers: [worker]
    evidence: "backend/prisma/schema.prisma (model PushToken + PushPlatform enum); backend/prisma/migrations/20260724120000_add_push_token/migration.sql; registration writer: backend/src/modules/notifications/service.ts (registerPushToken); worker reader/delete writer: backend/src/modules/notifications/outbox-transport.ts (PushTransportHandler.deliver)."
    note: "Delivery semantics: an OutboxEvent (state-outbox, transport PUSH) is DELIVERED as soon as at least one of a recipient's registered devices accepts the notification; per-device delivery tracking is out of scope. A token confirmed permanently invalid is deleted best-effort and does not by itself cause a retry -- only an all-devices transient failure does."
