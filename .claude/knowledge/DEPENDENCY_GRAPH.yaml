  - id: permissions-middleware
    version: unversioned
    owner_module: unassigned
    source: backend/src/middleware/permissions.ts
    note: "requireRole / requirePermission / checkHotelAccess authorization guards. backend-assignments removed from consumers 2026-07-08 (SPEC-AUTH-001 dependency review FIND-001, independently confirmed by architecture review): backend/src/modules/assignments/routes.ts imports only authMiddleware, not middleware/permissions; its comments cite service-level guards instead of route-level RBAC. Epic 5 PR 5.5 (2026-07-21, manager authorization flip, ADR-023/024/025): resolveHotelAccess() now scope-binds the manager role via the PR 5.4 JWT `scope` claim instead of the blanket bypass (flag-gated FEATURE_SCOPE_AUTHZ, default on; off = pre-fix behavior per ADR-024 D3). This adds a new read from permissions-middleware to state-hotel (Hotel.hotel_group_id, via the exported isHotelInScope() helper, for hotel_group-scoped managers) and makes the middleware a consumer of backend-auth's issued scope claim (req.auth.scope). resolveHotelAccess() (exported from permissions.ts) remains the single canonical role->scope authorization decision for the checkHotelAccess() middleware seam (Epic 3); isHotelInScope() is the shared scope-evaluation primitive it delegates to, additionally imported in-service by backend-attendance (attendance/service.ts list()/update()) and backend-quality (quality/service.ts createVerification()/createRating()) to enforce the same manager scope on their non-middleware-gated paths (SIR-ATT-002, SIR-QUAL-004) — those two consumers do not call resolveHotelAccess() itself (they are not routed through checkHotelAccess()), only the shared isHotelInScope() primitive it also uses. checkHotelAccess() still reads state-hotel-worker ACTIVE membership for the worker role (unchanged; the ADR-022 authz-migration removal of that branch is a later PR, gated on the scope claim being live). Recorded as evidence; formal edge_schema promotion (permissions->state-hotel; attendance/quality->permissions-middleware) deferred to the dedicated repository-synchronization pass that also owns the pending state-hotel-worker reader edges above. Epic 8 (2026-07-23, SIR-JOBD-002 / FIND-SEC-002/FIND-SEC-003): backend-work-requests (work-requests/service.ts create()/update()) and backend-work-applications (work-applications/service.ts update()'s reject path and approve()) now also import isHotelInScope() in-service, same shared primitive and same manager-only/flag-gated pattern as backend-attendance/backend-quality, closing the two sibling findings that Epic 5 PR 5.5 had no seam to flip for these two modules (they were never routed through checkHotelAccess()). ADR-030 (2026-07-25/26, PR-1..PR-8, Accepted, capability-based write-authority model, FEATURE_GD02_MATRIX): resolveHotelAccess() gains a REGIONAL_MANAGER branch mirroring the manager hotel_group scope resolution (PR-7 security review FIND-1, commit 82ff718 -- prior state had no RM branch at all, a gap this note's Epic 5 description did not yet reflect); backend-analytics' regional_manager/analytics:read gate gap closed with a D-8 debt-allowlist split (PR-7 review follow-up, commit 5719e05); frontend ManagerAdminGate consumer replaced by capability-named gates HotelWriteGate/StaffingWriteGate (PR-6, commit 8919c87) -- tracked here as the dependency-graph record of that consumer-side rename, not a change to this module's own exports. backend-work-applications removed from consumers by Epic 9 PR 9.2 (commits 12b1c31/2e89c4f, merged b035700; TREQ-011/ADR-058) -- the module was physically deleted (its in-service isHotelInScope() usage described above is a historical fact, unaffected). See SYNC-059.
    consumers:
      - backend-users
      - backend-crm
      - backend-job-requests  # renamed from backend-work-requests by Epic 9 PR 9.4. See SYNC-061.
      - backend-attendance
      - backend-quality
      - backend-hr
      - backend-analytics
      - backend-calendar
  - id: validation-middleware
    version: unversioned
    owner_module: unassigned
    source: backend/src/middleware/validation.ts
    note: "validateBody / validateQuery zod-schema request validation."
    consumers:
