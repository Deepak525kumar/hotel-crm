o owns the pending state-hotel-worker reader edges above. Epic 8 (2026-07-23, SIR-JOBD-002 / FIND-SEC-002/FIND-SEC-003): backend-work-requests (work-requests/service.ts create()/update()) and backend-work-applications (work-applications/service.ts update()'s reject path and approve()) now also import isHotelInScope() in-service, same shared primitive and same manager-only/flag-gated pattern as backend-attendance/backend-quality, closing the two sibling findings that Epic 5 PR 5.5 had no seam to flip for these two modules (they were never routed through checkHotelAccess())."
