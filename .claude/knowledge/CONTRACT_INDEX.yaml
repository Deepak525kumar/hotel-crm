    owner_module: unassigned  # OQ-AUTH-07 reassignment pending (SYNC-011)
    version: unversioned
    source: backend/src/middleware/permissions.ts
    interface: "requireRole / requirePermission / checkHotelAccess authorization guards"
    consumers: [backend-users, backend-crm, backend-work-requests, backend-work-applications, backend-attendance, backend-quality, backend-hr, backend-analytics, backend-calendar]
    note: backend-assignments removed 2026-07-08 (SPEC-AUTH-001 FIND-001, arch-confirmed); backend-hotel-workers removed by Epic 5 PR 5.8 (module physically deleted; ADR-022/ADR-024); routes.ts imports only authMiddleware. ADR-030 (2026-07-25/26, PR-1..PR-8, Accepted): capability-based write-authority model added -- FEATURE_GD02_MATRIX capability matrix (hotel/group writes admin-only; scoped users:write; manager/RM employee authority action-only), frontend ManagerAdminGate replaced by capability-named gates HotelWriteGate/StaffingWriteGate (PR-6, consumed outside this contract), and REGIONAL_MANAGER added to resolveHotelAccess() (PR-7 security review FIND-1, commit 82ff718) plus the analytics regional_manager/analytics:read gap closed with a D-8 debt-allowlist split (PR-7 follow-up, commit 5719e05). Supersedes the Epic 5 PR 5.5-only description above as the current authorization mechanism for backend-analytics and backend-users consumers.
  - id: validation-middleware
    owner_module: unassigned
    version: unversioned
    source: backend/src/middleware/validation.ts
    interface: "validateBody / validateQuery (zod-schema request validation)"
    consumers: [backend-users, backend-crm, backend-auth]
  - id: role-permissions
    owner_module: backend-auth
    version: unversioned
    source: backend/src/config/constants.ts
    interface: "ROLE_PERMISSIONS[UserRole] -> string[] (frozen map + frozen per-role arrays); the single live authorization authority, consulted per request, not read from a stored snapshot or JWT claim"
    consumers: [backend-auth, backend-users]
    note: "ADR-031 D-1/PR-8 (2026-07-27): reclassified from an internal write-time constant of backend-users (ADR-030-era: consulted only by the now-retired role-permissions-backfill.ts to populate the since-dropped User.permissions column) to a request-path shared contract node owned by backend-auth. Consulted unconditionally on every authenticated request by auth-middleware (ADR-031 PR-3/PR-7, both feature flags retired) to derive req.auth.permissions from User.role; also consulted by backend-users' users/service.ts and backend-auth's auth/service.ts to compute the (API-contract-preserving) permissions field on user response bodies, since the underlying DB column is dropped (ADR-031 M-3). Must remain deep-frozen at runtime (ADR-031 D-1 hardening, pinned by role-permissions-frozen.test.ts) -- a request-path authorization-integrity concern now, not just write-time hygiene. Resolves the shared-contract-node gap SIR-USERS-017 previously left open."

