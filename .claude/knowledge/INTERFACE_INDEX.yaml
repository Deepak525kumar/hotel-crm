schema_version: 1
purpose: >-
  Canonical lookup: named interface contract (IF-*) -> owning module -> defining
  specification -> build status -> ADR-053 risk tier. Answers "who owns this
  interface, is it built, and what confirmation policy would a tool over it
  require" without reading every module specification.

  Created 2026-08-23. Before this file existed there was no index over IF-* at
  all: CONTRACT_INDEX.yaml indexes something different (code-level shared
  contracts such as notification-service and auth-middleware), and the only way
  to resolve an IF-id was to grep 19 specifications. ADR-053 makes every chatbot
  tool a binding to an existing IF-* interface, so a registry needs exactly this
  table.

  This index SUMMARIZES the specifications and never outranks them
  (.claude/knowledge/README.md Rule 3). Where this file and a MODULE_SPEC.md
  disagree, the specification wins and this file is the thing to correct.
scope: project-specification
derived_from: [docs/03-modules]  # every MODULE_SPEC.md beneath it
version_source: .claude/VERSION.yaml
observed_revision: 8626256

# ---------------------------------------------------------------------------
# risk_tier values are ADR-053's three classes. They are recorded here so a
# future tool registry does not re-derive them:
#   read-only          executes immediately, no confirmation
#   low-risk-write     confirmation OPTIONAL, decided per tool at registration
#   high-risk-write    confirmation MANDATORY, enforced by the orchestration
#                      layer regardless of the tool's registration preference
#   not-tool-eligible  no HTTP surface / no human actor (scheduled jobs,
#                      in-process-only calls whose transactional guarantee
#                      depends on sharing the caller's transaction)
#   unassigned         the interface is TARGET (unbuilt); assigning a tier
#                      would mean inventing behaviour. Assign when it is built.
#
# RECORDING A TIER IS NOT APPROVAL TO EXPOSE AN INTERFACE AS A TOOL.
# ADR-053 principle 4: tool invocation is allow-listed, and each tool
# integration is its own explicit approval. This file is an inventory.
# ---------------------------------------------------------------------------

