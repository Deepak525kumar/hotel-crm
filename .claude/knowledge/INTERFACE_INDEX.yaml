summary:
  total: 123
  as_built: 50
  target: 71
  suspect: 2
  note: >-
    50 as-built contracts were reverse-specified on 2026-08-23 across the six
    specifications that previously declared none -- job-dispatch, attendance,
    quality, notifications, analytics and onboarding. Those six were exactly the
    worker-facing capabilities a chatbot needs to reach, so ADR-053's tool
    registry had nothing to bind to. The remaining `target` rows predate that
    pass and describe interfaces that are specified but not built; they carry no
    risk tier because assigning one would mean inventing behaviour.

known_gaps:
  - The 'target' rows are not evidence that a capability is missing from the
    product -- several describe behaviour delivered under a different name by a
    different module. Reconciling them is per-spec work, not an index change.
  - >-
    IF-CRM-Hotel and IF-GEO-DISTANCE are recorded as suspect - they were
    extracted from prose rather than a contract row and are probably not real
    identifiers.
  - No interface anywhere carries a real version. Contracts are unversioned in
    code, so every row is effectively v0 with a baseline/UNKNOWN compatibility
    posture. Version assignment remains a pending human decision
    (DEPENDENCY_GRAPH.yaml remaining_human_decisions).
