schema_version: 1
purpose: >-
  Boot Manifest (Context Management Layer, framework 1.5.0). Declares the
  minimum authoritative document set loaded once per framework version at boot
  — the machine-readable, executable projection of the Boot Context
  (ART-BOOT-001) whose canonical policy is constitution/CONTEXT_ARTIFACTS.md
  §2.1/§8. This file NEVER restates constitutional text; it lists which
  authorities the boot phase resolves and how (eager vs lazy). On conflict the
  constitution wins (Source of Truth §Authority Hierarchy).
scope: framework            # reusable engineering policy (CLAUDE.md Knowledge Separation)
canonical_policy: .claude/constitution/CONTEXT_ARTIFACTS.md
version_source: .claude/VERSION.yaml
framework_version: 1.5.0    # MUST equal VERSION.yaml current_version (context-loader.js --validate enforces)
boot_context_id: ART-BOOT-001
cache_scope: framework-version   # invalidated only by a framework version change

# Minimum authoritative boot set. `eager` = resolved at boot; `lazy` = resolved
# on first demand (reference-over-copy, CONTEXT_ARTIFACTS.md §1.3). Absent this
# manifest the platform degrades to reading every authoritative document
# (pre-1.5.0 behaviour), never to a governance gap (§1.5 fail-safe).
documents:
  - path: .claude/constitution/ENGINEERING_CONSTITUTION.md
    load: eager
  - path: .claude/constitution/SOURCE_OF_TRUTH.md
    load: eager
  - path: .claude/constitution/REVIEW_GATES.md
    load: eager
  - path: .claude/constitution/LOOP_CONTROL.md
    load: eager
  - path: .claude/constitution/CONTEXT_ARTIFACTS.md
    load: eager
  - path: .claude/knowledge/PROJECT_PROFILE.md
    load: eager
  - path: .claude/constitution/REVIEWER_FINDINGS.md
    load: lazy
