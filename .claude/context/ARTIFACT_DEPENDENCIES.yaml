schema_version: 1
purpose: >-
  Artifact Dependencies (Context Management Layer, framework 1.5.0). The
  machine-readable projection of the Context Artifact dependency and
  invalidation graph defined canonically in constitution/CONTEXT_ARTIFACTS.md
  §2 (dependencies) and §3.2 (invalidation binding). `context-loader.js` reads
  this to (a) expand an artifact request into its transitive dependencies
  (artifact-level dependency loading) and (b) know which cache scope and
  invalidators govern each artifact (cache invalidation, revision-aware
  loading). This file restates NO policy text; on conflict CONTEXT_ARTIFACTS.md
  wins, and `--validate` cross-checks every `invalidated_by` against
  knowledge/SYNC_STATE.yaml context_invalidators.
scope: framework
canonical_policy: .claude/constitution/CONTEXT_ARTIFACTS.md
version_source: .claude/VERSION.yaml
framework_version: 1.5.0

# cache_scope values mirror CONTEXT_ARTIFACTS.md §3.1:
#   framework-version | revision | revision+capability | candidate-version | module+freeze-revision
# `lazy: true` marks an artifact resolved on demand rather than at boot
# (reference-over-copy, §1.3). `depends_on` edges cascade downstream only (§3.2).
artifacts:
  - id: ART-BOOT-001
    cache_scope: framework-version
    lazy: false
    depends_on: []
    invalidated_by:
      - framework version change

  - id: ART-REPO-001
    cache_scope: revision
    lazy: false
    depends_on: []
    invalidated_by:
      - repository revision changes
      - default branch changes

  - id: ART-EVID-001
    cache_scope: revision
    lazy: false
    depends_on: [ART-REPO-001]
    invalidated_by:
      - repository revision changes
      - default branch changes
      - architecture or ownership decision
      - contract, event, schema, package, or consumer change

  - id: ART-DEPCTX
    cache_scope: revision+capability
    lazy: true
    depends_on: [ART-EVID-001]
    invalidated_by:
      - contract, event, schema, package, or consumer change
      - architecture or ownership decision

  - id: ART-MEM
    cache_scope: module+freeze-revision
    lazy: true
    depends_on: [ART-EVID-001]
    invalidated_by:
      - specification status or version change
      - contract, event, schema, package, or consumer change

  - id: ART-CTX
    cache_scope: candidate-version
    lazy: false
    depends_on: [ART-BOOT-001, ART-EVID-001, ART-DEPCTX]
    invalidated_by:
      - repository revision changes
      - contract, event, schema, package, or consumer change

  - id: ART-BOUNDARY-001
    cache_scope: revision
    lazy: true
    depends_on: [ART-DEPCTX]
    invalidated_by:
      - architecture or ownership decision
      - repository revision changes

  - id: ART-REV-PKG
    cache_scope: candidate-version
    lazy: false
    depends_on: [ART-CTX]
    invalidated_by:
      - repository revision changes

  - id: ART-FIND-PKG
    cache_scope: candidate-version
    lazy: false
    depends_on: [ART-REV-PKG]
    invalidated_by:
      - repository revision changes

  - id: ART-CORR
    cache_scope: candidate-version
    lazy: false
    depends_on: [ART-FIND-PKG]
    invalidated_by:
      - repository revision changes

  - id: ART-INTEGRITY-001
    cache_scope: revision
    lazy: false
    depends_on: []
    invalidated_by:
      - repository revision changes
