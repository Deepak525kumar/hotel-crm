schema_version: 1
purpose: >-
  Execution Manifest (Context Management Layer, framework 1.5.0). The single
  declarative source for the *minimum authoritative artifact set per workflow*
  — the concern that, before 1.5.0, was implicit in each workflow's prose
  ("Context Packages", "Inputs"). It references canonical artifact IDs and
  document paths; it never restates their content. `context-loader.js resolve
  --workflow <id>` reads this file, expands artifact dependencies
  (ARTIFACT_DEPENDENCIES.yaml), reuses warm session context, and loads only the
  delta — so every workflow inherits deterministic minimum loading without
  duplicating loading logic. Canonical loading policy:
  constitution/CONTEXT_ARTIFACTS.md §8.
scope: framework
canonical_policy: .claude/constitution/CONTEXT_ARTIFACTS.md
version_source: .claude/VERSION.yaml
framework_version: 1.5.0    # MUST equal VERSION.yaml current_version (context-loader.js --validate enforces)

# Each workflow lists ONLY what it authoritatively needs beyond the always-on
# Boot set (BOOT_MANIFEST.yaml). `documents` are document-level authorities;
# `artifacts` are Context Artifacts (constitution/CONTEXT_ARTIFACTS.md §2) whose
# transitive dependencies the loader expands. Every .claude/workflows/*.md file
# MUST appear here exactly once (enforced by --validate).
workflows:
  - id: preflight
    file: .claude/workflows/preflight.md
    gates: [G0]
    documents:
      - path: .claude/workflows/preflight.md
        load: eager
      - path: .claude/knowledge/MODULE_REGISTRY.yaml
        load: eager
      - path: .claude/knowledge/DEPENDENCY_GRAPH.yaml
        load: eager
      - path: .claude/knowledge/SYNC_STATE.yaml
        load: eager
      - path: .claude/knowledge/SESSION_STATE.yaml
        load: eager
      - path: .claude/knowledge/CAPABILITY_REGISTRY.yaml
        load: lazy
      - path: .claude/checklists/preflight.md
        load: lazy
    artifacts:
      - ref: ART-BOOT-001
      - ref: ART-EVID-001

  - id: repository-synchronization
    file: .claude/workflows/repository-synchronization.md
    gates: [G0]
    documents:
      - path: .claude/workflows/repository-synchronization.md
        load: eager
      - path: .claude/knowledge/MODULE_REGISTRY.yaml
        load: eager
      - path: .claude/knowledge/DEPENDENCY_GRAPH.yaml
        load: eager
      - path: .claude/knowledge/SYNC_STATE.yaml
        load: eager
      - path: .claude/knowledge/SESSION_STATE.yaml
        load: eager
      - path: .claude/knowledge/TERMINOLOGY.md
        load: lazy
    artifacts:
      - ref: ART-EVID-001
      - ref: ART-REPO-001

  - id: requirements
    file: .claude/workflows/requirements.md
    gates: [G1]
    documents:
      - path: .claude/workflows/requirements.md
        load: eager
      - path: .claude/templates/REQUIREMENTS_REGISTER_TEMPLATE.md
        load: eager
      - path: .claude/knowledge/TERMINOLOGY.md
        load: eager
      - path: .claude/checklists/business-rules.md
        load: lazy
    artifacts:
      - ref: ART-CTX
      - ref: ART-EVID-001

  - id: documentation
    file: .claude/workflows/documentation.md
    gates: [G1.5, G2, G4]
    documents:
      - path: .claude/workflows/documentation.md
        load: eager
      - path: .claude/templates/MODULE_SPEC_TEMPLATE.md
        load: eager
      - path: .claude/knowledge/SPECIFICATION_INDEX.yaml
        load: eager
      - path: .claude/knowledge/MODULE_MEMORY.yaml
        load: eager
      - path: .claude/governance/SPECIFICATION_ISSUES_REGISTER.md
