# /etc/nginx/conf.d/version-control-map.conf
#
# http-level context (conf.d is included from the http block). `map` is not
# valid inside a server block, which is why this is split from the locations
# snippet.
#
# SECURITY — cookie isolation.
#
# The CRM API sets access_token/refresh_token on this host with path=/ and no
# Domain attribute, so a browser attaches them to EVERY request to
# api.deepcleaninghub.de — including the anonymous /install pages served by a
# different process on :3002. Without this filter, a compromise of the
# distribution service would be handed live CRM sessions.
#
# This variable is used as the proxied Cookie header for the version-control
# locations, so only that service's own `vc_session` cookie survives. Everything
# else is dropped at the edge and never reaches port 3002.
map $http_cookie $vc_session_cookie {
    default                                  "";
    "~*(?:^|;\s*)(vc_session=[^;]*)"          $1;
}

# Rate-limit zones for the distribution surfaces. Tuned for shared NAT: a hotel
# floor installing at once comes from one public IP.
limit_req_zone $binary_remote_addr zone=vc_admin:10m   rate=5r/s;
limit_req_zone $binary_remote_addr zone=vc_public:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=vc_binary:10m  rate=2r/s;
