# /etc/nginx/snippets/version-control.conf
#
# Included inside the TLS server block for api.deepcleaninghub.de:
#     include /etc/nginx/snippets/version-control.conf;
#
# Requires /etc/nginx/conf.d/version-control-map.conf for $vc_session_cookie
# and the limit_req zones.

# ── Authenticated upload / promotion / history surface ───────────────────────
location /version-control {
    limit_req zone=vc_admin burst=20 nodelay;

    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "no-referrer"        always;
    add_header X-Robots-Tag           "noindex, nofollow"  always;

    # Whole .ipa/.apk files arrive here.
    client_max_body_size 1024M;
    # Streamed rather than buffered to disk first: a 200 MB upload over hotel
    # Wi-Fi must not be staged in /var/cache before the app ever sees it.
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_pass         http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # See the cookie-isolation note in version-control-map.conf.
    proxy_set_header   Cookie            $vc_session_cookie;
}

# ── Binary downloads ─────────────────────────────────────────────────────────
# A regex location wins over the /install prefix below, so the heavy transfers
# get their own limits and no response buffering.
location ~ ^/install/[^/]+/(download|icon)$ {
    limit_req zone=vc_binary burst=10 nodelay;

    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-Robots-Tag           "noindex, nofollow" always;

    proxy_buffering    off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_pass         http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Cookie            $vc_session_cookie;
}

# ── Anonymous install pages ──────────────────────────────────────────────────
location /install {
    limit_req zone=vc_public burst=40 nodelay;

    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-Frame-Options        "DENY"              always;
    add_header Referrer-Policy        "no-referrer"       always;
    add_header X-Robots-Tag           "noindex, nofollow" always;

    proxy_pass         http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Cookie            $vc_session_cookie;
}
