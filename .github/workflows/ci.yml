name: CI

on:
  push:
    # Prefix list verified against this repo's own branch history rather than
    # assumed: `feat/` (62 branches) is the most-used prefix here and was
    # NEVER matched by the previous list, which had `feature/**` but not
    # `feat/**`. `docs/`, `chore/`, `refactor/`, `ci/` and `claude/` were
    # likewise unmatched. The gap was masked because any branch with an open
    # PR still gets covered by the `pull_request` trigger below -- but a push
    # BEFORE a PR exists got zero coverage, and the masking disappears
    # entirely if a `branches:` filter is ever re-added to `pull_request`.
    branches:
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
      - 'refactor/**'
      - 'ci/**'
      - 'claude/**'
      - develop
      - main
  pull_request:
    # No `branches:` filter: a PR stacked on another feature branch (e.g.
    # feat/regional-manager-lifecycle onto feat/regional-manager-authorization,
    # while the latter's own PR to main was still open) has a base ref that
    # isn't develop/main, and previously got ZERO CI coverage — only Vercel's
    # unconditional per-PR check ran, silently. That gap went undetected in
    # this repo's own history (PR #339) until the base was retargeted to main
    # after the underlying PR merged. Filtering by base branch encodes "which
    # branch is currently the merge target," but that's exactly the property
    # that's in flux for a stacked PR — so don't filter on it.
    #
    # `types:` deliberately omits `edited`: that event also fires on a plain
    # title/description/label edit, and this workflow is expensive (a
    # Postgres service container, three separate `npm ci` installs, a mobile
    # matrix) — running it on every metadata tweak would be a real cost for a
    # base-branch-retarget case this repo hits rarely. Retargeting a PR's base
    # (as #339 needed once its stacked-on PR merged) does not itself produce a
    # `synchronize` event; re-run the workflow manually (Actions tab -> Re-run
    # jobs) or push any commit after retargeting to pick up default coverage.
    types: [opened, synchronize, reopened]
  # Manual trigger. Added 2026-08-07 after a GitHub Actions incident in which
  # webhook delivery was throttled platform-wide: push and pull_request events
  # were silently dropped, so a PR sat with zero CI runs and there was NO way
  # to start one -- neither workflow declared workflow_dispatch, and the
  # Actions tab offers no run button without it. Re-running a previous run
  # doesn't help when no run was ever created. This is the break-glass path
  # for that case.
  workflow_dispatch:
  workflow_call:

# Least-privilege default token for every job; CI only needs to read the repo.
permissions:
  contents: read

# Dedup fix (2026-08-06): `push` and `pull_request` are BOTH intentionally
# unfiltered/broad (see the `pull_request` comment above) so a commit pushed
# to a branch with an open PR fires this workflow twice — once per event,
# full job matrix each time (Postgres container, three `npm ci` installs, a
# mobile matrix). `github.head_ref` is only populated on `pull_request`
# events; `github.ref` is what's left for `push`/`workflow_call` — so this
# key is identical for the push-triggered and pull_request-triggered run of
# the same branch/commit, letting GitHub cancel the redundant one rather
# than running both to completion. Does NOT reopen the #339 stacked-PR gap
# (d464e68): that was about `pull_request` being filtered OUT entirely by
# base branch; this still runs pull_request unconditionally, it just stops
# also running push's duplicate of the same commit.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository Integrity Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run deterministic integrity checks
        run: node .claude/tooling/repository-integrity-check.js --format md --out integrity-report.md

      - name: Show report
        if: always()
        run: cat integrity-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-integrity-report
          path: integrity-report.md

  context-manifest:
    name: Context Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Context Management Layer manifests
        run: node .claude/tooling/context-loader.js --validate

  ci:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hotelcrm_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Prisma migrate (test DB)
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/hotelcrm_test

      # Schema-drift gate. Added 2026-08-20 after PR #498 shipped three schema
      # changes -- two WorkerOverallRating columns, three Contract columns and
      # three NotificationType enum values -- with NO migration for any of
      # them, and this workflow went green anyway.
      #
      # Nothing here could have caught it. `migrate deploy` succeeds happily
      # against an incomplete history (there is simply nothing pending), and
      # the backend suite mocks Prisma on the affected paths, so the columns
      # are never actually selected. The drift only surfaces on a database
      # built from the migration history -- i.e. staging and production, where
      # refreshWorkerOverallRating() raises P2022 on every rating write.
      #
      # This compares the migration history against schema.prisma directly and
      # fails when they disagree. --exit-code makes a non-empty diff exit 2.
      - name: Migration drift check (schema.prisma vs migration history)
        working-directory: backend
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d postgres -c 'CREATE DATABASE drift_shadow;'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://test:test@localhost:5432/drift_shadow \
            --exit-code

      # --runInBand (npm run test:ci), NOT the parallel default.
      #
      # Parallel runs in this suite are unreliable enough to be misleading:
      # they have reported failures that pass in isolation, and -- worse --
      # UNDER-reported real ones. A change that genuinely broke two suites
      # (18 tests) surfaced as 2 failures in parallel, which looks exactly
      # like the usual noise and is easy to wave through. A gate whose output
      # you learn to distrust is not a gate.
      #
      # Serial costs nothing here: these suites mock Prisma rather than
      # hitting a database, so worker startup outweighs the parallelism --
      # measured locally at ~21s serial against ~28-64s parallel.
      #
      # `npm test` stays parallel for local iteration; this is the merge gate.
      - name: Tests
        run: npm run test:ci
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/hotelcrm_test
          NODE_ENV: test
          PORT: 3001
          JWT_SECRET: test-secret-min-32-characters-long!!
          JWT_REFRESH_SECRET: test-refresh-secret-32-chars-long!!
          JWT_ACCESS_EXPIRY: 1h
          JWT_REFRESH_EXPIRY: 7d
          APNS_PRIVATE_KEY_BASE64: dGVzdA==
          APNS_KEY_ID: TESTKEY123
          APNS_TEAM_ID: TESTTEAM123
          APNS_BUNDLE_ID_WORKER: com.hotelcrm.workerapp.test
          APNS_BUNDLE_ID_CHECKER: com.hotelcrm.checkerapp.test
          FIREBASE_PROJECT_ID: test-project
          AWS_REGION: eu-central-1
          S3_BUCKET: test-bucket
          S3_BUCKET_BACKUPS: test-backups
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          REDIS_URL: ''

  frontend:
    name: Frontend · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps (workspaces)
        run: npm ci

      - name: Typecheck
        run: npm run type-check --workspace frontend

      - name: Lint
        run: npm run lint --workspace frontend

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/app/**', 'frontend/components/**', 'frontend/lib/**', 'frontend/hooks/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # Runs BEFORE the build: a failing assertion should stop the job at the
      # cheap step, not after a full Next production build.
      - name: Test
        run: npm test --workspace frontend

      - name: Build
        run: npm run build --workspace frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Real-browser checks for what the jest suite (jsdom) cannot see: actual
  # layout. Added because RTL direction and language switching had each
  # separately shipped broken (2026-08-16 i18n review, PR #475) despite a
  # clean jsdom suite -- `dir="rtl"` set correctly, real strings still
  # rendering in English -- and neither was catchable without a browser.
  #
  # Runs against a real `next build && next start`, not `next dev`, and
  # mocks the handful of `/api/v1/*` calls each screen needs (see
  # frontend/e2e/rtl-protected.spec.ts's own header comment for why that is
  # a deliberate, narrow exception to this repo's "verify at the data layer"
  # rule rather than a way around it): there is no database available to CI
  # for this job, and the alternative is not running these checks in a
  # browser at all.
  frontend-e2e:
    name: Frontend · E2E (RTL)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps (workspaces)
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require(require.resolve('@playwright/test/package.json')).version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright's browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --workspace frontend playwright install --with-deps chromium
        timeout-minutes: 6

      # System libraries are apt packages and are NOT inside the cached browser
      # directory, so they must still be installed on a cache hit.
      #
      # timeout-minutes on both install steps is the point, not an
      # optimisation: without it a stalled download runs to GitHub's 6-hour
      # job default, holding a runner and presenting as a job that is merely
      # "still running" -- which is exactly how a 27-minute hang read from the
      # outside before the cache landed. Six minutes is ~4x the observed
      # healthy time (~1m45s for the whole job).
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 6
        run: npx --workspace frontend playwright install-deps chromium

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/app/**', 'frontend/components/**', 'frontend/lib/**', 'frontend/hooks/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        run: npm run build --workspace frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: E2E
        run: npm run test:e2e --workspace frontend
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  mobile:
    name: Mobile · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [worker-app, checker-app]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/${{ matrix.app }}/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: mobile/${{ matrix.app }}

      # Covers src/** including screens and components, not just tests and
      # lib. tsconfig.test.json's include previously listed only
      # __tests__/__mocks__/lib/stores/types and no .tsx pattern at all, so
      # no screen was ever typechecked here — a screen that could not compile
      # passed CI for a full PR cycle. Verified before the fix: an injected
      # type error in src/app/documents.tsx was invisible to the old include
      # and is caught by the current one.
      - name: Typecheck
        run: npm run typecheck
        working-directory: mobile/${{ matrix.app }}

      - name: Unit tests
        run: npm test -- --ci
        working-directory: mobile/${{ matrix.app }}

  # manager-app is NOT in the matrix above, and cannot be: that job runs
  # `npm ci` inside each app against the app's own package-lock.json, and
  # manager-app depends on `@hotel-crm/mobile-shared`, a workspace package
  # that exists only in this repository. A standalone install would try to
  # fetch it from the registry and fail.
  #
  # So this job installs from the repository root, where the workspace links
  # mobile/shared into place, and runs the same three gates. Lint is included
  # here deliberately: it is the gate that gets skipped and the one that fails
  # CI (see CLAUDE.md).
  mobile-manager:
    name: Mobile · manager-app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace deps
        run: npm ci

      - name: Typecheck (shared)
        run: npm run typecheck --workspace @hotel-crm/mobile-shared

      - name: Typecheck
        run: npm run typecheck --workspace manager-app

      - name: Lint
        run: npx expo lint
        working-directory: mobile/manager-app

      - name: Unit tests
        run: npm test --workspace manager-app -- --ci
