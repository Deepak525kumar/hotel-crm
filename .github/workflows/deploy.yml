name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2

    # Only deploy if CI succeeded on main
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Debug SSH connectivity
        run: |
          echo "HOST=${{ secrets.EC2_HOST }}"

          which ssh-keyscan

          ssh-keyscan -v -T 10 ${{ secrets.EC2_HOST }}

          nc -vz ${{ secrets.EC2_HOST }} 22 || true

          ping -c 3 ${{ secrets.EC2_HOST }} || true

      - name: Deploy
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            cd ${{ secrets.PROJECT_PATH }}

            export DEPLOY_SHA="${DEPLOY_SHA}"

            chmod +x deploy.sh

            ./deploy.sh
          EOF

      - name: Verify deployment
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "curl -fsS http://localhost:3001/api/v1/health"
